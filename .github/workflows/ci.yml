name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  managed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore HapticAgent.sln 2>&1 | Tee-Object managed-restore.log
          exit $LASTEXITCODE

      - name: Build
        shell: pwsh
        run: |
          dotnet build HapticAgent.sln --configuration Release --no-restore 2>&1 | Tee-Object managed-build.log
          exit $LASTEXITCODE

      - name: Run tests
        shell: pwsh
        run: |
          dotnet run --project tests/HapticAgent.Tests/HapticAgent.Tests.csproj --configuration Release --no-build 2>&1 | Tee-Object managed-tests.log
          exit $LASTEXITCODE

      - name: Upload managed logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-build-logs
          path: managed-*.log

  native-gameinput:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore GameInput bridge
        shell: pwsh
        run: |
          msbuild native/HapticAgent.GameInputBridge/HapticAgent.GameInputBridge.vcxproj /t:Restore /m /p:Configuration=Release /p:Platform=x64 2>&1 | Tee-Object native-restore.log
          exit $LASTEXITCODE

      - name: Capture GameInput package layout
        shell: pwsh
        run: |
          $root = Join-Path $env:USERPROFILE '.nuget\packages\microsoft.gameinput\3.4.259'
          Get-ChildItem $root -Recurse | ForEach-Object { $_.FullName.Substring($root.Length + 1) } | Set-Content native-package-files.log

      - name: Build GameInput bridge
        shell: pwsh
        run: |
          msbuild native/HapticAgent.GameInputBridge/HapticAgent.GameInputBridge.vcxproj /m /p:Configuration=Release /p:Platform=x64 2>&1 | Tee-Object native-build.log
          exit $LASTEXITCODE

      - name: Upload native logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: native-*.log
