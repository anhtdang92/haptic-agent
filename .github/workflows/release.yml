name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run tests
        shell: pwsh
        run: |
          dotnet run --project tests/CtrlAgent.Tests/CtrlAgent.Tests.csproj --configuration Release
          exit $LASTEXITCODE

      - name: Publish console host
        shell: pwsh
        run: |
          dotnet publish src/CtrlAgent.App/CtrlAgent.App.csproj `
            --configuration Release --runtime win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            --output staging/app
          exit $LASTEXITCODE

      - name: Publish desktop GUI
        shell: pwsh
        run: |
          dotnet publish src/CtrlAgent.Gui/CtrlAgent.Gui.csproj `
            --configuration Release --runtime win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            --output staging/gui
          exit $LASTEXITCODE

      - name: Build GameInput bridge
        shell: pwsh
        run: |
          msbuild native/CtrlAgent.GameInputBridge/CtrlAgent.GameInputBridge.vcxproj /restore /m /p:Configuration=Release /p:Platform=x64
          exit $LASTEXITCODE

      - name: Assemble package
        shell: pwsh
        run: |
          $name = "CtrlAgent-$($env:GITHUB_REF_NAME)-win-x64"
          New-Item -ItemType Directory -Path "package/$name" | Out-Null
          Copy-Item staging/app/CtrlAgent.App.exe "package/$name/"
          Copy-Item staging/gui/CtrlAgent.Gui.exe "package/$name/"
          Copy-Item native/CtrlAgent.GameInputBridge/x64/Release/CtrlAgent.GameInputBridge.exe "package/$name/"
          Copy-Item README.md, LICENSE "package/$name/"
          Copy-Item docs "package/$name/docs" -Recurse
          Compress-Archive -Path "package/$name" -DestinationPath "$name.zip"
          echo "PACKAGE_NAME=$name" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $name = "CtrlAgent-$($env:GITHUB_REF_NAME)-win-x64"
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$env:GITHUB_REF_NAME `
            /DStagingDir="$PWD\package\$name" `
            /DRepoRoot="$PWD" `
            /O"$PWD" `
            installer\CtrlAgent.iss
          exit $LASTEXITCODE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            CtrlAgent-Setup-*.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGE_NAME }}.zip
            CtrlAgent-Setup-*.exe
          generate_release_notes: true
