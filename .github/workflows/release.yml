name: release

on:
  push:
    tags: ['v*']
  # Manual releases create the requested tag and release from the current
  # default branch after the exact artifacts pass qualification.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag to create (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$env:RELEASE_VERSION'. Expected vMAJOR.MINOR.PATCH."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore CtrlAgent.sln
          exit $LASTEXITCODE

      - name: Build managed solution
        shell: pwsh
        run: |
          dotnet build CtrlAgent.sln --configuration Release --no-restore
          exit $LASTEXITCODE

      - name: Run tests
        shell: pwsh
        run: |
          dotnet run --project tests/CtrlAgent.Tests/CtrlAgent.Tests.csproj --configuration Release --no-build
          exit $LASTEXITCODE

      - name: Publish console host
        shell: pwsh
        run: |
          dotnet publish src/CtrlAgent.App/CtrlAgent.App.csproj `
            --configuration Release --runtime win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            --output staging/app
          exit $LASTEXITCODE

      - name: Publish desktop GUI
        shell: pwsh
        run: |
          dotnet publish src/CtrlAgent.Gui/CtrlAgent.Gui.csproj `
            --configuration Release --runtime win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            --output staging/gui
          exit $LASTEXITCODE

      - name: Build GameInput bridge
        shell: pwsh
        run: |
          msbuild native/CtrlAgent.GameInputBridge/CtrlAgent.GameInputBridge.vcxproj /restore /m /p:Configuration=Release /p:Platform=x64
          exit $LASTEXITCODE

      - name: Assemble portable package
        shell: pwsh
        run: |
          $name = "CtrlAgent-$($env:RELEASE_VERSION)-win-x64"
          New-Item -ItemType Directory -Path "package/$name" | Out-Null
          Copy-Item staging/app/CtrlAgent.App.exe "package/$name/"
          Copy-Item staging/gui/CtrlAgent.Gui.exe "package/$name/"
          Copy-Item native/CtrlAgent.GameInputBridge/x64/Release/CtrlAgent.GameInputBridge.exe "package/$name/"
          Copy-Item README.md, LICENSE "package/$name/"
          Copy-Item docs "package/$name/docs" -Recurse
          Compress-Archive -Path "package/$name" -DestinationPath "$name.zip"
          echo "PACKAGE_NAME=$name" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $name = "CtrlAgent-$($env:RELEASE_VERSION)-win-x64"
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$env:RELEASE_VERSION `
            /DStagingDir="$PWD\package\$name" `
            /DRepoRoot="$PWD" `
            /O"$PWD" `
            installer\CtrlAgent.iss
          exit $LASTEXITCODE

      - name: Qualify exact release artifacts
        shell: pwsh
        run: |
          ./tools/Test-ReleaseReadiness.ps1 `
            -Version $env:RELEASE_VERSION `
            -PortableZip "$env:PACKAGE_NAME.zip" `
            -Installer "CtrlAgent-Setup-$env:RELEASE_VERSION.exe" `
            -ReportPath release-readiness-report.json

      - name: Upload qualified artifacts and evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          if-no-files-found: error
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            CtrlAgent-Setup-*.exe
            SHA256SUMS.txt
            release-readiness-report.json

      # Publication is deliberately last. A failed build, test, package check,
      # install rehearsal, uninstall rehearsal, or checksum step prevents the
      # tag/release from being created by a manual run.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: CtrlAgent ${{ env.RELEASE_VERSION }}
          files: |
            ${{ env.PACKAGE_NAME }}.zip
            CtrlAgent-Setup-*.exe
            SHA256SUMS.txt
            release-readiness-report.json
          generate_release_notes: true
