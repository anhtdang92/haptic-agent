name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag to create (for example v0.9.0-beta.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
  WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
  WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}

jobs:
  signed-release:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and normalize version
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?<suffix>[.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$env:RELEASE_VERSION'."
          }
          $packageVersion = "$($Matches.major).$($Matches.minor).$($Matches.patch).0"
          "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Restore, compile, and test
        shell: pwsh
        run: |
          dotnet restore CtrlAgent.sln
          dotnet restore tests/CtrlAgent.FocusTests/CtrlAgent.FocusTests.csproj
          dotnet build CtrlAgent.sln --configuration Release --no-restore
          dotnet build tests/CtrlAgent.FocusTests/CtrlAgent.FocusTests.csproj --configuration Release --no-restore
          dotnet run --project tests/CtrlAgent.Tests/CtrlAgent.Tests.csproj --configuration Release --no-build
          dotnet run --project tests/CtrlAgent.FocusTests/CtrlAgent.FocusTests.csproj --configuration Release --no-build

      - name: Build rollback rehearsal installer
        shell: pwsh
        run: |
          ./tools/release/Build-ReleaseArtifacts.ps1 `
            -DisplayVersion 'v0.0.1-rollback-fixture' `
            -PackageVersion '0.0.1.0' `
            -OutputRoot 'artifacts/previous'

      - name: Build and sign exact release artifacts
        shell: pwsh
        run: |
          ./tools/release/Build-ReleaseArtifacts.ps1 `
            -DisplayVersion $env:RELEASE_VERSION `
            -PackageVersion $env:PACKAGE_VERSION `
            -OutputRoot 'artifacts/current' `
            -RequireSigning

      - name: Qualify exact signed release
        shell: pwsh
        run: |
          ./tools/Test-ReleaseReadiness.ps1 `
            -Version $env:RELEASE_VERSION `
            -PortableZip "artifacts/current/CtrlAgent-$env:RELEASE_VERSION-win-x64.zip" `
            -Installer "artifacts/current/installer/CtrlAgent-Setup-$env:RELEASE_VERSION-win-x64.exe" `
            -PreviousInstaller 'artifacts/previous/installer/CtrlAgent-Setup-v0.0.1-rollback-fixture-win-x64.exe' `
            -PreviousVersion 'v0.0.1-rollback-fixture' `
            -ReportPath 'artifacts/current/release-readiness-report.json' `
            -RequireSignature
          Copy-Item SHA256SUMS.txt artifacts/current/SHA256SUMS.txt -Force

      - name: Attest portable archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/current/CtrlAgent-${{ env.RELEASE_VERSION }}-win-x64.zip

      - name: Attest installer
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/current/installer/CtrlAgent-Setup-${{ env.RELEASE_VERSION }}-win-x64.exe

      - name: Upload qualified artifacts and evidence
        uses: actions/upload-artifact@v4
        with:
          name: CtrlAgent-${{ env.RELEASE_VERSION }}-win-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/current/CtrlAgent-${{ env.RELEASE_VERSION }}-win-x64.zip
            artifacts/current/installer/CtrlAgent-Setup-${{ env.RELEASE_VERSION }}-win-x64.exe
            artifacts/current/SHA256SUMS.txt
            artifacts/current/release-readiness-report.json
            artifacts/current/logs/**

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: CtrlAgent ${{ env.RELEASE_VERSION }}
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/current/CtrlAgent-${{ env.RELEASE_VERSION }}-win-x64.zip
            artifacts/current/installer/CtrlAgent-Setup-${{ env.RELEASE_VERSION }}-win-x64.exe
            artifacts/current/SHA256SUMS.txt
            artifacts/current/release-readiness-report.json
            tools/release/Invoke-CtrlAgentRollback.ps1
